<nav
  class="flex items-stretch justify-around h-full rounded-3xl backdrop-blur-2xl border border-surface shadow-lg"
>
  @for (item of layout.bottomNavItems; track item.route) {
    <a
      [routerLink]="item.route"
      routerLinkActive="text-primary font-semibold"
      [routerLinkActiveOptions]="{ exact: true }"
      #rla="routerLinkActive"
      class="relative flex-1 flex flex-col items-center justify-center gap-1 no-underline text-surface-500 transition-all duration-200 select-none"
    >
      <i
        [class]="item.icon"
        [ngClass]="rla.isActive ? 'text-primary text-2xl!' : ''"
        class="text-xl transition-all duration-200"
      ></i>

      <span
        [ngClass]="rla.isActive ? 'text-primary text-2xl' : ''"
        class="text-xs transition-all duration-200 bold"
      >
        {{ item.label }}
      </span>
    </a>
  }
</nav>
