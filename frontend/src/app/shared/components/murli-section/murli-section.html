<div class="flex flex-col lg:flex-row gap-4 md:gap-6 p-5 bg-surface-card">
  <div class="md:w-30 shrink-0">
    <h3 class="text-base md:text-lg font-semibold">{{ title }}</h3>
  </div>
  <div class="flex-1 min-w-0 text-sm md:text-base leading-relaxed self-center w-full">
    @if (editing) {
      @if (title == 'Avyakt Signal') {
        <textarea
          [value]="content"
          (input)="
            contentChange.emit({
              fieldKey: fieldKey || title.toLowerCase(),
              value: $any($event.target).value,
            })
          "
          placeholder="{{ title }} title..."
          class="w-full py-2 px-4 border rounded-md h-12"
          rows="4"
        ></textarea>
      }
      <textarea
        [value]="content"
        (input)="
          contentChange.emit({
            fieldKey: fieldKey || title.toLowerCase(),
            value: $any($event.target).value,
          })
        "
        placeholder="{{ title }}..."
        class="w-full py-2 px-4 border rounded-md min-h-12"
        rows="4"
      ></textarea>
    } @else {
      @if (subtitle) {
        <strong>{{ subtitle }}</strong>
      }
      <p>{{ content }}</p>
    }
  </div>
</div>
