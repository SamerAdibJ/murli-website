<div class="flex flex-col lg:flex-row gap-4 md:gap-6 p-5 bg-surface-card">
  <!-- Title column -->
  <div class="md:w-30 shrink-0">
    <h3 class="text-base md:text-lg font-semibold">
      {{ title }}
    </h3>
  </div>

  <!-- Content column -->
  @if (content || subtitle) {
    <div class="flex-1 min-w-0 text-sm md:text-base leading-relaxed">
      @if (subtitle) {
        <strong class="mb-24">{{ subtitle }}</strong>
      }
      <p>{{ content }}</p>
    </div>
  }
</div>
