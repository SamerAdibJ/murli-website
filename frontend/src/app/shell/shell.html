<div class="flex h-full flex-column max-md:space-between" [dir]="appService.dir()">
  <!-- Desktop sidebar -->
  <aside class="w-64 min-w-64 flex flex-col border-e border-amber-950 max-md:hidden">
    <div class="p-4 font-bold text-lg">Morning Murli</div>
    <app-sidebar-menu class="flex-1 flex flex-col" />
  </aside>

  <!-- Main content area -->
  <main class="flex-1 overflow-y-auto p-6 pb-20 md:pb-6">
    <router-outlet />
  </main>

  <!-- Mobile bottom nav -->
  <div class="hidden max-md:flex fixed bottom-0 inset-x-0 h-16 bg-surface-card z-100">
    <app-bottom-nav class="w-full" />
  </div>
</div>
